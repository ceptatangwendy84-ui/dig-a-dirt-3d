<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer();

renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);

// FIX PERFORMANCE
renderer.shadowMap.enabled = false;

// LIGHT
const light = new THREE.DirectionalLight(0xffffff, 1);

light.position.set(5, 10, 5);

scene.add(light);

// PLAYER POSITION
camera.position.set(0, 5, 10);

// WORLD
const world = [];

const blockSize = 2;
const mapSize = 2;

// BLOCK GEOMETRY
const geometry = new THREE.BoxGeometry(
blockSize,
blockSize,
blockSize
);

// MATERIALS
const dirtMaterial = new THREE.MeshLambertMaterial({
color: 0x8b4513
});

const goldMaterial = new THREE.MeshLambertMaterial({
color: 0xffcc00
});

// GENERATE WORLD
for(let x = -mapSize; x <= mapSize; x++)
{
for(let z = -mapSize; z <= mapSize; z++)
{
for(let y = -3; y <= 0; y++)
{

let material = dirtMaterial;

// RANDOM GOLD
if(Math.random() < 0.1)
{
material = goldMaterial;
}

const cube = new THREE.Mesh(
geometry,
material
);

cube.position.set(
x * blockSize,
y * blockSize,
z * blockSize
);

scene.add(cube);

world.push(cube);

}
}
}

// CONTROLS
const keys = {};

window.addEventListener("keydown", (e)=>
{
keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (e)=>
{
keys[e.key.toLowerCase()] = false;
});

// DIG SYSTEM
const raycaster = new THREE.Raycaster();

window.addEventListener("click", ()=>
{

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

const hit = raycaster.intersectObjects(world);

if(hit.length > 0)
{
const block = hit[0].object;

scene.remove(block);

const index = world.indexOf(block);

if(index > -1)
{
world.splice(index,1);
}
}

});

// GAME LOOP
function animate()
{
requestAnimationFrame(animate);

// MOVEMENT
if(keys["w"]) camera.position.z -= 0.1;
if(keys["s"]) camera.position.z += 0.1;
if(keys["a"]) camera.position.x -= 0.1;
if(keys["d"]) camera.position.x += 0.1;

renderer.render(scene, camera);
}

animate();
</script>
