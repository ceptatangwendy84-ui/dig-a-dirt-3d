<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dig A Dirt 3D</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
}

#ui{
position:fixed;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,0.5);
padding:15px;
border-radius:10px;
font-size:18px;
}

#crosshair{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:30px;
pointer-events:none;
}

#shop{
position:fixed;
right:10px;
bottom:10px;
background:rgba(0,0,0,0.5);
padding:15px;
border-radius:10px;
color:white;
}

button{
padding:10px;
margin-top:5px;
width:180px;
border:none;
border-radius:10px;
background:orange;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
💰 Coins: <span id="coins">0</span><br>
📦 Inventory: <span id="inventory">0</span><br>
⛏ Tool: Wooden Shovel
</div>

<div id="crosshair">+</div>

<div id="shop">
<h3>🛒 Shop</h3>
<button onclick="sellItems()">Sell Inventory</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

// LIGHT
const ambient = new THREE.AmbientLight(
0xffffff,
1.2
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
0xffffff,
2
);

light.position.set(10,20,10);

scene.add(light);

// PLAYER
camera.position.set(
0,
10,
20
);

camera.lookAt(0,0,0);

// WORLD
const world = [];

const geometry = new THREE.BoxGeometry(
3,
3,
3
);

let inventory = 0;
let coins = 0;

const dirtMaterial = new THREE.MeshLambertMaterial({
color:0x8b4513
});

const goldMaterial = new THREE.MeshLambertMaterial({
color:0xffcc00
});

// GENERATE WORLD
for(let x=-5;x<=5;x++)
{
for(let z=-5;z<=5;z++)
{
for(let y=-2;y<=0;y++)
{

let material = dirtMaterial;

if(Math.random() < 0.1)
{
material = goldMaterial;
}

const cube = new THREE.Mesh(
geometry,
material
);

cube.position.set(
x * 3,
y * 3,
z * 3
);

scene.add(cube);

world.push(cube);

}
}
}

// MOVEMENT
const keys = {};

window.addEventListener(
"keydown",
(e)=>{
keys[e.key.toLowerCase()] = true;
}
);

window.addEventListener(
"keyup",
(e)=>{
keys[e.key.toLowerCase()] = false;
}
);

// DIG SYSTEM
const raycaster = new THREE.Raycaster();

window.addEventListener(
"click",
()=>{

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

const hits = raycaster.intersectObjects(world);

if(hits.length > 0)
{
const block = hits[0].object;

scene.remove(block);

const index = world.indexOf(block);

if(index > -1)
{
world.splice(index,1);
}

inventory++;

document.getElementById(
"inventory"
).innerText = inventory;

}
}
);

// SELL
function sellItems()
{
coins += inventory * 10;

inventory = 0;

document.getElementById(
"coins"
).innerText = coins;

document.getElementById(
"inventory"
).innerText = inventory;
}

// GAME LOOP
function animate()
{
requestAnimationFrame(animate);

// MOVEMENT
if(keys["w"]) camera.position.z -= 0.3;
if(keys["s"]) camera.position.z += 0.3;
if(keys["a"]) camera.position.x -= 0.3;
if(keys["d"]) camera.position.x += 0.3;

renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
